name: Build tvOS IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the IPA to (leave empty for artifact only)"
        required: false
        type: string
      ref:
        description: "Git ref to build (branch, tag or SHA; empty = this workflow's ref)"
        required: false
        type: string
  push:
    tags:
      - "tvos-*"

permissions:
  contents: write

jobs:
  build:
    # GitHub-hosted Apple Silicon macOS. Xcode selection is the image default;
    # the "Show toolchain" step records exactly which one built the IPA.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: Install pinned toolchain (mise -> tuist)
        run: |
          brew install mise
          mise install
          mise exec -- tuist version

      - name: Build unsigned IPA
        env:
          # Shown in Settings → About as "<tag>-<commit>", so the device can
          # name the exact build it is running after a sideload.
          BOOMIO_BUILD_STAMP: ${{ inputs.tag || github.ref_name }}-${{ github.sha }}
          # Bundled Trakt app: a public client id, the same kind that already
          # ships inside the Android client. NuvioTV/Info.plist expands it into
          # TraktClientID, which is what makes on-device sign-in a six-character
          # code at trakt.tv/activate instead of typing an id. Unset builds
          # expand it to empty and simply ship without a bundled app.
          TRAKT_CLIENT_ID: ${{ vars.TRAKT_CLIENT_ID }}
          # Public TMDB API key, expanded into TmdbApiKey in the Info.plist so
          # actor search and person pages work without per-device setup, as on
          # Android. Unset builds ship without one.
          TMDB_API_KEY: ${{ vars.TMDB_API_KEY }}
        run: bash scripts/build-ipa.sh

      - name: Report output
        run: ls -lh build-ipa/

      - uses: actions/upload-artifact@v4
        with:
          name: boomio-tvos-ipa
          path: build-ipa/*.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Unsigned tvOS build"
          gh release upload "$TAG" build-ipa/*.ipa --clobber
